name: Restructure verified MIT dev source
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-mit-dev-source.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: historical-mit-dev-restructure
  cancel-in-progress: false

jobs:
  prepare-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository and ZIP
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify uploaded archive against pinned historical MIT source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="bdbe69946f66305a8b4d1577eeaf1f4e398f6660"
          TREE="4701eedf3af9c2a434375ad4c3e8f0c75ad7d097"
          AGPL="52ae2004220c3b67f9e98507647c0351db71f950"
          git remote add upstream https://github.com/odysseus-dev/odysseus.git
          git fetch --no-tags upstream refs/heads/dev
          git cat-file -e "$SOURCE^{commit}"
          git cat-file -e "$AGPL^{commit}"
          test "$(git rev-parse "$SOURCE^{tree}")" = "$TREE"
          test "$(git rev-parse "$AGPL^")" = "$SOURCE"
          test "$(git show "$SOURCE:LICENSE" | sed -n '1p')" = "MIT License"
          git show "$SOURCE:README.md" | grep -F "MIT -- see [LICENSE]" >/dev/null
          python3 - <<'PY'
          import hashlib, pathlib, subprocess, zipfile
          source = "bdbe69946f66305a8b4d1577eeaf1f4e398f6660"
          archive = pathlib.Path("odysseus-bdbe69946f66305a8b4d1577eeaf1f4e398f6660.zip")
          assert archive.is_file(), "User-uploaded ZIP is missing"
          records = subprocess.check_output(["git", "ls-tree", "-r", "-z", source]).split(b"\0")
          expected = {}
          for record in records:
              if record:
                  meta, path = record.split(b"\t", 1)
                  mode, kind, sha = meta.decode("ascii").split()
                  assert kind == "blob", (path, kind)
                  expected[path.decode("utf-8")] = (mode, sha)
          def git_blob_sha(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          with zipfile.ZipFile(archive) as z:
              entries = [e for e in z.infolist() if not e.is_dir()]
              names = [e.filename for e in entries]
              prefixes = {name.split("/",1)[0] for name in names}
              assert len(prefixes) == 1, prefixes
              prefix = next(iter(prefixes)) + "/"
              actual = {}
              for entry in entries:
                  assert entry.filename.startswith(prefix)
                  path = entry.filename[len(prefix):]
                  assert path and not path.startswith("/") and ".." not in path.split("/"), path
                  assert path not in actual, path
                  actual[path] = entry
              assert set(actual) == set(expected), (
                  "Archived file inventory differs from MIT source",
                  len(actual), len(expected),
                  sorted(set(expected)-set(actual))[:10],
                  sorted(set(actual)-set(expected))[:10])
              normalized = []
              mismatches = []
              for path, (mode, sha) in expected.items():
                  data = z.read(actual[path])
                  if git_blob_sha(data) == sha:
                      continue
                  if path.endswith((".ps1", ".bat", ".cmd")) and git_blob_sha(data.replace(b"\r\n", b"\n")) == sha:
                      normalized.append(path)
                      continue
                  mismatches.append(path)
              assert not mismatches, ("Content mismatch", mismatches[:25])
              assert z.read(actual["LICENSE"]).startswith(b"MIT License\n")
          assert len(expected) == 1022, len(expected)
          print("PASS: 1022 original tracked files present")
          print("PASS: content hashes match upstream Git blobs (Windows EOL normalized:", normalized, ")")
          print("PASS: original upstream MIT Git tree:", "4701eedf3af9c2a434375ad4c3e8f0c75ad7d097")
          PY

      - name: Stage source files at root without GitHub App workflow-write permission
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="bdbe69946f66305a8b4d1577eeaf1f4e398f6660"
          BASE="$(git rev-parse HEAD)"
          TEMP_WORKFLOW_SHA="$(git rev-parse "$BASE:.github/workflows/restore-mit-dev-source.yml")"
          WORKFLOW_TREE_SHA="$(git rev-parse "$SOURCE:.github/workflows")"
          test "$WORKFLOW_TREE_SHA" = "fb80df02ea4950a085c925b7abb97497636fffe6"
          git read-tree "$SOURCE^{tree}"
          python3 - <<'PY'
          import subprocess
          source = "bdbe69946f66305a8b4d1577eeaf1f4e398f6660"
          records = subprocess.check_output(
              ["git", "ls-tree", "-r", "-z", source, ".github/workflows"]).split(b"\0")
          n = 0
          for record in records:
              if not record:
                  continue
              meta, path = record.split(b"\t",1)
              mode, kind, sha = meta.decode("ascii").split()
              original = path.decode("utf-8")
              assert kind == "blob" and original.startswith(".github/workflows/")
              temporary = "_mit_source_workflows/" + original[len(".github/workflows/"):]
              subprocess.run(["git","update-index","--add","--cacheinfo",
                              ",".join((mode,sha,temporary))], check=True)
              subprocess.run(["git","update-index","--force-remove",original], check=True)
              n += 1
          assert n == 4, n
          print("Staged four original GitHub workflow files in temporary source folder")
          PY
          git update-index --add --cacheinfo "100644,$TEMP_WORKFLOW_SHA,.github/workflows/restore-mit-dev-source.yml"
          CANDIDATE_TREE="$(git write-tree)"
          test "$(git rev-parse "$CANDIDATE_TREE:_mit_source_workflows")" = "$WORKFLOW_TREE_SHA"
          test "$(git rev-parse "$CANDIDATE_TREE:LICENSE")" = "7087e2d598700ecb40f09a0fbf3f12952fcf641e"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CANDIDATE="$(git commit-tree "$CANDIDATE_TREE" -p "$BASE" -m "Stage exact original MIT dev source at GitHub repository root")"
          git push origin "$CANDIDATE:refs/heads/extract-mit-dev-source-candidate"
          echo "CANDIDATE_SHA=$CANDIDATE"
          echo "ORIGINAL_SOURCE_SHA=$SOURCE"
          echo "ORIGINAL_SOURCE_TREE=4701eedf3af9c2a434375ad4c3e8f0c75ad7d097"
